name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validate curated source snapshot
        run: python tools/release_check.py
      - name: Unit, HTTP and Gradio integration tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 7
